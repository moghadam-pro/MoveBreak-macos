name: macOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test timer and localization
        run: swift test
      - name: Validate catalogs
        run: python3 scripts/validate-localization.py
      - name: Build universal app and disk image
        run: |
          scripts/build-app.sh release universal
          scripts/build-dmg.sh
      - name: Smoke test the packaged application
        run: scripts/smoke-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MoveBreak-macOS
          path: |
            artifacts/*.dmg
            artifacts/*.dmg.sha256
  beta-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MoveBreak-macOS
          path: artifacts
      - name: Publish beta installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg artifacts/*.dmg.sha256 --verify-tag --prerelease --title "MoveBreak $(cat VERSION)" --notes-file docs/BETA-RELEASE.md
      - name: Mark beta 2 as superseded
        if: github.ref_name == 'v0.2.0-beta.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.2.0-beta.2 --prerelease --title "Superseded — MoveBreak 0.2.0-beta.2" --notes-file docs/BETA2-SUPERSEDED.md
